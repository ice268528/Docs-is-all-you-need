<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DIAYN Minimal Fixture</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f5f7f6;
      color: #172026;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 32px 20px;
    }
    form {
      display: grid;
      gap: 12px;
      max-width: 420px;
      margin: 24px 0;
    }
    label {
      display: grid;
      gap: 6px;
      font-weight: 700;
    }
    input, button {
      font: inherit;
      padding: 10px 12px;
      border: 1px solid #b9c4c0;
      border-radius: 6px;
    }
    button {
      cursor: pointer;
      border-color: #1f6f64;
      background: #1f6f64;
      color: white;
    }
    #status {
      min-height: 28px;
      padding: 10px 12px;
      border-radius: 6px;
      background: #e4f1ee;
    }
  </style>
</head>
<body>
  <main>
    <h1>DIAYN Minimal Fixture</h1>
    <p>Register and log in with a test email. This page calls the backend API and expects persisted data.</p>
    <form id="fixture-form">
      <label>Email <input id="email" type="email" autocomplete="username" required></label>
      <label>Password <input id="password" type="password" autocomplete="current-password" minlength="6" required></label>
      <button id="register" type="button">Register</button>
      <button id="login" type="submit">Log in</button>
    </form>
    <div id="status" role="status">Ready.</div>
  </main>
  <script>
    const form = document.querySelector("#fixture-form");
    const statusNode = document.querySelector("#status");
    const emailNode = document.querySelector("#email");
    const passwordNode = document.querySelector("#password");

    async function callApi(path) {
      const response = await fetch(path, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ email: emailNode.value, password: passwordNode.value })
      });
      const data = await response.json();
      statusNode.textContent = data.ok
        ? `${path.includes("register") ? "Registered" : "Logged in"} ${data.user.email}`
        : `Error: ${data.error}`;
      return { response, data };
    }

    document.querySelector("#register").addEventListener("click", () => {
      callApi("/api/register").catch((error) => {
        statusNode.textContent = `Error: ${error.message}`;
      });
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      callApi("/api/login").catch((error) => {
        statusNode.textContent = `Error: ${error.message}`;
      });
    });
  </script>
</body>
</html>
